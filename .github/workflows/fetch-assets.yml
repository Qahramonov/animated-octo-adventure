# Downloads CC0 assets (Poly Haven) listed in tools/assets/manifest.json and commits them.
name: Fetch Assets
on:
  workflow_dispatch:
  push:
    paths:
      - "tools/assets/**"
      - ".github/workflows/fetch-assets.yml"
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: List available assets
        run: python3 tools/assets/fetch_polyhaven.py list > polyhaven-list.txt && wc -l polyhaven-list.txt && grep -E "^(texture|model) " polyhaven-list.txt | grep -iE "terrain|rock|bark|wood|sand|grass|nature|props|plant|tool|weapon|container" | head -700
      - name: Fetch manifest
        run: python3 tools/assets/fetch_polyhaven.py fetch tools/assets/manifest.json UnityClient/Assets/ThirdParty/PolyHaven
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add UnityClient/Assets/ThirdParty
          git diff --cached --quiet && { echo "nothing new"; exit 0; }
          du -sh UnityClient/Assets/ThirdParty
          git commit -m "Add CC0 assets from Poly Haven (fetched by CI) [skip ci]"
          git pull --rebase --autostash origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
