# Downloads CC0 assets (Poly Haven) listed in tools/assets/manifest.json into the orphan branch
# 'assets-raw'. tools/assets/convert.py turns them into game-ready meshes/textures in the project.
name: Fetch Assets
on:
  workflow_dispatch:
  push:
    paths:
      - "tools/assets/manifest.json"
      - "tools/assets/fetch_polyhaven.py"
      - ".github/workflows/fetch-assets.yml"
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Fetch manifest (raw files)
        run: python3 tools/assets/fetch_polyhaven.py fetch tools/assets/manifest.json raw
      - name: Push raw files to the assets-raw branch (kept out of the game branch)
        run: |
          du -sh raw
          cd raw
          git init -q -b assets-raw
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Raw CC0 assets from Poly Haven"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" assets-raw
