# Re-runs the emulator smoke test on the published apk-latest APK (no Unity build, no license seat).
name: Emulator Smoke Test
on:
  workflow_dispatch:
  push:
    paths:
      - "tools/ci/emulator-smoke.sh"
      - ".github/workflows/emulator-smoke.yml"
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Download apk-latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: mkdir -p apk && gh release download apk-latest -p OROL-Survival.apk -D apk -R "$GITHUB_REPOSITORY"
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          force-avd-creation: true
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -camera-back none -skin 1920x1080
          disable-animations: true
          script: bash tools/ci/emulator-smoke.sh apk/OROL-Survival.apk smoke
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-test-${{ github.run_number }}
          path: smoke
          retention-days: 14
