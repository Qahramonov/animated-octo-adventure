# Builds the Android game in the cloud with Unity 6 (GameCI). No computer needed:
#  1. Add the Unity license secrets once (docs/BUILD_APK.md, section "Unity litsenziyasi").
#  2. Push to any branch (or run it manually: Actions -> Android APK -> Run workflow).
#  3. Download the APK from the run's Artifacts, or from the "apk-latest" GitHub Release
#     (direct .apk link that opens on a phone).
#
# Required secrets (free Personal license): UNITY_EMAIL, UNITY_PASSWORD
#   GameCI acquires a Personal seat from Unity's licensing service with the account credentials and
#   returns it after the build - no computer and no .ulf file needed.
# Plus/Pro: add UNITY_SERIAL as well.  Enterprise .ulf: UNITY_LICENSE (optional, overrides the account route).
# Optional release signing (Google Play):
#   ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASS, ANDROID_KEYALIAS_NAME, ANDROID_KEYALIAS_PASS
# Without signing secrets the APK is signed with Unity's debug key (installable on your own phone).
name: Android APK

on:
  push:
    paths:
      - "UnityClient/**"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch:
    inputs:
      exportType:
        description: "apk = install on phone, aab = Google Play bundle"
        type: choice
        options: [apk, aab]
        default: apk
      development:
        description: "Development build (profiler, debug log)"
        type: boolean
        default: false

permissions:
  contents: write   # publish the APK to the "apk-latest" release

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

env:
  BUILD_NAME: OROL-Survival
  RELEASE_TAG: apk-latest

jobs:
  android:
    name: Build Android (${{ inputs.exportType || 'apk' }})
    runs-on: ubuntu-latest
    timeout-minutes: 150
    outputs:
      artifact: ${{ env.BUILD_NAME }}-${{ steps.out.outputs.ext }}-${{ github.run_number }}
      file: ${{ steps.out.outputs.name }}
      ext: ${{ steps.out.outputs.ext }}
    steps:
      - name: Check Unity license secrets
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          missing=""
          [ -z "$UNITY_EMAIL" ] && missing="$missing UNITY_EMAIL"
          [ -z "$UNITY_PASSWORD" ] && missing="$missing UNITY_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error title=Unity license is not configured::Missing repository secrets:$missing. Follow docs/BUILD_APK.md (Unity litsenziyasi). No APK can be built without them."
            {
              echo "## Unity license secrets are missing"
              echo ""
              echo "Missing:\`$missing\`"
              echo ""
              echo "Unity requires an activated license to build. Add the secrets in"
              echo "**Settings > Secrets and variables > Actions** - step by step in \`docs/BUILD_APK.md\`."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          if [ -n "$UNITY_SERIAL" ]; then echo "Licensing: serial (Plus/Pro)";
          elif [ -n "$UNITY_LICENSE" ]; then echo "Licensing: license file";
          else echo "Licensing: free Personal seat via Unity account (returned after the build)"; fi

      - uses: actions/checkout@v4
        with:
          lfs: false

      - name: Free disk space (Unity Android image is ~9 GB)
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: true
          swap-storage: false

      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: UnityClient/Library
          key: Library-Android-${{ hashFiles('UnityClient/Assets/**', 'UnityClient/Packages/**', 'UnityClient/ProjectSettings/**') }}
          restore-keys: |
            Library-Android-

      - name: Build with Unity (GameCI)
        id: build
        uses: game-ci/unity-builder@v6.0.0
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: UnityClient
          targetPlatform: Android
          buildName: ${{ env.BUILD_NAME }}
          buildMethod: Survival.Editor.BuildScript.BuildAndroid
          versioning: Custom
          version: 0.1.${{ github.run_number }}
          androidVersionCode: ${{ github.run_number }}
          androidExportType: ${{ inputs.exportType == 'aab' && 'androidAppBundle' || 'androidPackage' }}
          androidKeystoreName: release.keystore
          androidKeystoreBase64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          androidKeystorePass: ${{ secrets.ANDROID_KEYSTORE_PASS }}
          androidKeyaliasName: ${{ secrets.ANDROID_KEYALIAS_NAME }}
          androidKeyaliasPass: ${{ secrets.ANDROID_KEYALIAS_PASS }}
          # x86_64 is included so the same APK can be launched on the CI emulator (smoke test below)
          customParameters: -development ${{ inputs.development && 'true' || 'false' }} -androidArch arm64+x86_64

      - name: Collect build output
        id: out
        run: |
          set -e
          sudo chown -R "$(id -u)":"$(id -g)" build || true
          ls -la build/Android || true
          file=$(ls build/Android/*.apk build/Android/*.aab 2>/dev/null | head -1 || true)
          if [ -z "$file" ]; then
            echo "::error title=No build output::Unity finished but no .apk/.aab was found. Open the 'Build with Unity' step log and search for 'error' / '[Build]'."
            exit 1
          fi
          name="${BUILD_NAME}-0.1.${GITHUB_RUN_NUMBER}.${file##*.}"
          cp "$file" "build/$name"
          (cd build && sha256sum "$name" > "$name.sha256")
          echo "file=build/$name" >> "$GITHUB_OUTPUT"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "ext=${file##*.}" >> "$GITHUB_OUTPUT"
          size=$(du -h "build/$name" | cut -f1)
          {
            echo "## Build succeeded"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| File | \`$name\` ($size) |"
            echo "| Version | 0.1.${GITHUB_RUN_NUMBER} (code ${GITHUB_RUN_NUMBER}) |"
            echo "| Commit | ${GITHUB_SHA::7} |"
            echo "| SHA-256 | \`$(cut -d' ' -f1 build/$name.sha256)\` |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BUILD_NAME }}-${{ steps.out.outputs.ext }}-${{ github.run_number }}
          path: |
            ${{ steps.out.outputs.file }}
            ${{ steps.out.outputs.file }}.sha256
            build/Android/build-info.txt
          retention-days: 30

      - name: Publish to the apk-latest release (direct download on the phone)
        if: steps.out.outputs.ext == 'apk'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          notes="OROL Survival ${{ steps.out.outputs.name }} - built by GitHub Actions from commit ${GITHUB_SHA::7} (${GITHUB_REF_NAME}).

          Install: open the .apk below on your Android phone and allow installing from this source.
          Debug-signed unless release signing secrets are configured. Phase 1 demo: see docs/ROADMAP.md.

          SHA-256: $(cut -d' ' -f1 ${{ steps.out.outputs.file }}.sha256)"
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release delete-asset "$RELEASE_TAG" "OROL-Survival.apk" -y >/dev/null 2>&1 || true
            gh release edit "$RELEASE_TAG" --notes "$notes" --prerelease --target "$GITHUB_SHA"
          else
            gh release create "$RELEASE_TAG" --title "OROL Survival - latest APK" --notes "$notes" --prerelease --target "$GITHUB_SHA"
          fi
          cp "${{ steps.out.outputs.file }}" OROL-Survival.apk
          gh release upload "$RELEASE_TAG" OROL-Survival.apk "${{ steps.out.outputs.file }}.sha256" --clobber
          echo "Download: https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}/OROL-Survival.apk" >> "$GITHUB_STEP_SUMMARY"

  # Launches the freshly built APK on an Android emulator (x86_64) and records what happens:
  # screenshots over ~90 s + logcat. Errors are printed into this job's log.
  smoke-test:
    name: Emulator smoke test
    needs: android
    if: needs.android.outputs.ext == 'apk'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.android.outputs.artifact }}
          path: apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          force-avd-creation: true
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -feature -Vulkan -camera-back none -skin 1920x1080
          disable-animations: true
          script: bash tools/ci/emulator-smoke.sh apk/${{ needs.android.outputs.file }} smoke
      - name: Upload smoke-test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-test-${{ github.run_number }}
          path: smoke
          retention-days: 14
