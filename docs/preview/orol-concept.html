<title>OROL Survival Concept</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Russo+One&family=Play:wght@400;700&display=swap">
<style>
/* Layout: full-screen 3D scene with a landscape game HUD layered on top; notes panel below on narrow screens */
:root{
  --ink:#eef1ea; --muted:#a9b3a6; --panel:rgba(14,18,16,.62); --line:rgba(255,255,255,.14);
  --hp:#d4483b; --food:#e09a3a; --water:#3a9be0; --accent:#e7a33b; --bg:#0b0f0d;
  --display:"Russo One",Impact,"Arial Black",sans-serif; --body:"Play","Trebuchet MS",system-ui,sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);overflow:hidden}
#stage{position:fixed;inset:0}
canvas{display:block}
.hud{position:fixed;inset:0;pointer-events:none;padding:calc(10px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.tag{position:absolute;top:calc(12px + env(safe-area-inset-top,0px));left:max(16px,env(safe-area-inset-left,0px));display:grid;gap:2px}
.tag b{font-family:var(--display);font-size:22px;letter-spacing:.06em}
.tag span{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}
.map{position:absolute;top:calc(12px + env(safe-area-inset-top,0px));right:max(16px,env(safe-area-inset-right,0px));width:112px;height:112px;border-radius:50%;overflow:hidden;border:2px solid var(--line);background:var(--panel)}
.map canvas{width:100%;height:100%}
.map i{position:absolute;left:50%;top:50%;width:0;height:0;border-left:6px solid transparent;border-right:6px solid transparent;border-bottom:12px solid #fff;transform:translate(-50%,-60%)}
.coords{position:absolute;top:calc(130px + env(safe-area-inset-top,0px));right:max(16px,env(safe-area-inset-right,0px));font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.stats{position:absolute;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(14px + env(safe-area-inset-bottom,0px));display:grid;gap:5px;width:150px}
.bar{display:grid;grid-template-columns:18px 1fr 30px;align-items:center;gap:6px;font-size:11px;font-variant-numeric:tabular-nums}
.bar div{height:9px;background:rgba(255,255,255,.12);border-radius:2px;overflow:hidden}
.bar div s{display:block;height:100%}
.hot{position:absolute;left:50%;bottom:calc(14px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);display:flex;gap:5px}
.slot{width:48px;height:48px;background:var(--panel);border:1px solid var(--line);border-radius:4px;position:relative;display:grid;place-items:center}
.slot.on{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
.slot em{position:absolute;right:3px;bottom:1px;font-style:normal;font-size:10px;font-variant-numeric:tabular-nums}
.slot sup{position:absolute;left:4px;top:2px;font-size:9px;color:var(--muted)}
.cross{position:absolute;left:50%;top:50%;width:6px;height:6px;margin:-3px;border-radius:50%;background:rgba(255,255,255,.85)}
.feed{position:absolute;left:max(16px,env(safe-area-inset-left,0px));bottom:calc(84px + env(safe-area-inset-bottom,0px));display:grid;gap:4px}
.feed div{background:var(--panel);padding:4px 10px;border-radius:3px;font-size:12px;animation:pop 3s infinite}
.feed div:nth-child(2){animation-delay:1s}
@keyframes pop{0%{opacity:0;transform:translateX(-8px)}10%,70%{opacity:1;transform:none}100%{opacity:.35}}
.joy{position:absolute;left:max(36px,env(safe-area-inset-left,0px));bottom:calc(100px + env(safe-area-inset-bottom,0px));width:96px;height:96px;border-radius:50%;border:2px solid var(--line);background:rgba(0,0,0,.18)}
.joy:after{content:"";position:absolute;inset:30px;border-radius:50%;background:rgba(255,255,255,.25)}
.btns{position:absolute;right:max(180px,env(safe-area-inset-right,0px));bottom:calc(20px + env(safe-area-inset-bottom,0px));display:flex;gap:10px}
.btns span{width:58px;height:58px;border-radius:50%;background:rgba(0,0,0,.28);border:2px solid var(--line);display:grid;place-items:center;font-size:11px;letter-spacing:.06em}
.btns span.big{width:72px;height:72px;border-color:var(--accent);color:var(--accent)}
.legend{position:absolute;left:50%;top:calc(12px + env(safe-area-inset-top,0px));transform:translateX(-50%);background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:6px 12px;font-size:11px;color:var(--muted);text-align:center;max-width:46ch}
@media (max-width:700px){.joy,.btns,.feed{display:none}.stats{width:120px}.slot{width:38px;height:38px}.map{width:84px;height:84px}.coords{top:calc(102px + env(safe-area-inset-top,0px))}.legend{top:auto;bottom:calc(74px + env(safe-area-inset-bottom,0px))}}
@media (prefers-reduced-motion:reduce){.feed div{animation:none}}
</style>

<div id="stage"></div>
<div class="hud" aria-label="Пример игрового интерфейса">
  <div class="tag"><b>OROL</b><span>концепт · примерный вид</span></div>
  <div class="legend">Примерный вид после обновления. Модели здесь условные, в игре будут CC0-модели с анимациями.</div>
  <div class="map"><canvas id="mini" width="200" height="200"></canvas><i></i></div>
  <div class="coords">X 2481 · Z 1937 · 06:42</div>
  <div class="feed"><div>+12 Дерево</div><div>+6 Металлическая руда</div></div>
  <div class="cross"></div>
  <div class="joy"></div>
  <div class="btns"><span>ПРЫЖОК</span><span class="big">УДАР</span></div>
  <div class="hot" id="hot"></div>
  <div class="stats">
    <div class="bar"><span>❤</span><div><s style="width:82%;background:var(--hp)"></s></div><span>82</span></div>
    <div class="bar"><span>🍖</span><div><s style="width:61%;background:var(--food)"></s></div><span>61</span></div>
    <div class="bar"><span>💧</span><div><s style="width:47%;background:var(--water)"></s></div><span>47</span></div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
const hot=[["🪓","",1],["⛏","",0],["🔥","3",0],["🪵","240",0],["🪨","180",0],["⚙","36",0]];
document.getElementById('hot').innerHTML=hot.map((h,i)=>`<div class="slot${h[2]?' on':''}"><sup>${i+1}</sup>${h[0]}<em>${h[1]}</em></div>`).join('');

const W=()=>innerWidth,H=()=>innerHeight;
const r=new THREE.WebGLRenderer({antialias:true});r.setPixelRatio(Math.min(devicePixelRatio,2));r.setSize(W(),H());
r.shadowMap.enabled=true;r.outputEncoding=THREE.sRGBEncoding;
document.getElementById('stage').appendChild(r.domElement);
const s=new THREE.Scene();s.background=new THREE.Color(0xf0b98a);s.fog=new THREE.Fog(0xe9b08a,40,140);
const cam=new THREE.PerspectiveCamera(55,W()/H(),.1,500);
s.add(new THREE.HemisphereLight(0xffe2c4,0x3b4a3a,.75));
const sun=new THREE.DirectionalLight(0xffd2a0,1.15);sun.position.set(-30,40,20);sun.castShadow=true;
sun.shadow.mapSize.set(2048,2048);Object.assign(sun.shadow.camera,{left:-40,right:40,top:40,bottom:-40});s.add(sun);

let seed=7;const rnd=()=>(seed=(seed*16807)%2147483647)/2147483647;
const M=c=>new THREE.MeshStandardMaterial({color:c,flatShading:true,roughness:.9});
function add(g,m,x,y,z,sh=true){const o=new THREE.Mesh(g,m);o.position.set(x,y,z);o.castShadow=sh;o.receiveShadow=true;s.add(o);return o}
const hgt=(x,z)=>Math.sin(x*.06)*1.4+Math.cos(z*.05)*1.2+Math.sin((x+z)*.13)*.4;

// ground with colour variation
const gg=new THREE.PlaneGeometry(220,220,90,90);gg.rotateX(-Math.PI/2);
const col=[];const p=gg.attributes.position;
for(let i=0;i<p.count;i++){const x=p.getX(i),z=p.getZ(i);let y=hgt(x,z);const d=Math.hypot(x,z+10);if(d>70)y-= (d-70)*.25;p.setY(i,y);
 const c=new THREE.Color(y<-.6?0xd8c38f:(rnd()<.5?0x5f7f3a:0x6f8d42));col.push(c.r,c.g,c.b)}
gg.setAttribute('color',new THREE.Float32BufferAttribute(col,3));gg.computeVertexNormals();
const ground=new THREE.Mesh(gg,new THREE.MeshStandardMaterial({vertexColors:true,flatShading:true,roughness:1}));ground.receiveShadow=true;s.add(ground);
const sea=new THREE.Mesh(new THREE.PlaneGeometry(600,600),new THREE.MeshStandardMaterial({color:0x2f6f86,roughness:.25,metalness:.1,transparent:true,opacity:.92}));sea.rotation.x=-Math.PI/2;sea.position.y=-1.4;s.add(sea);

function pine(x,z,k){const y=hgt(x,z);add(new THREE.CylinderGeometry(.18*k,.3*k,2.2*k,6),M(0x5a3d26),x,y+1.1*k,z);
 for(let i=0;i<4;i++)add(new THREE.ConeGeometry((1.9-i*.38)*k,1.9*k,7),M(i%2?0x2f5a34:0x29502e),x,y+(2+i*1.05)*k,z)}
function birch(x,z,k){const y=hgt(x,z);add(new THREE.CylinderGeometry(.14*k,.2*k,4*k,6),M(0xe6e2d6),x,y+2*k,z);
 [[0,4.6,0,1.5],[.7,4,.3,1.1],[-.6,4.1,-.2,1.2]].forEach(b=>add(new THREE.IcosahedronGeometry(b[3]*k,0),M(0x8ea83f),x+b[0]*k,y+b[1]*k,z+b[2]*k))}
function rock(x,z,k,c){const y=hgt(x,z);const g=new THREE.DodecahedronGeometry(k,0);g.scale(1,.7,1.1);return add(g,M(c),x,y+k*.3,z)}
function ore(x,z,base,fleck){const o=rock(x,z,1.15,base);const y=hgt(x,z);
 for(let i=0;i<7;i++){const a=rnd()*6.28,b=rnd()*1.2;const f=add(new THREE.OctahedronGeometry(.17+rnd()*.12,0),new THREE.MeshStandardMaterial({color:fleck,flatShading:true,metalness:.6,roughness:.35,emissive:fleck,emissiveIntensity:.08}),x+Math.cos(a)*.95*Math.cos(b*.5),y+.35+Math.sin(b)*.6,z+Math.sin(a)*.95*Math.cos(b*.5),false)}}

for(let i=0;i<70;i++){const a=rnd()*6.28,d=14+rnd()*48;const x=Math.cos(a)*d,z=Math.sin(a)*d-14;if(Math.abs(x)<5&&z>-12)continue;(rnd()<.65?pine:birch)(x,z,.8+rnd()*.6)}
for(let i=0;i<14;i++){const a=rnd()*6.28,d=8+rnd()*35;rock(Math.cos(a)*d,Math.sin(a)*d-10,.5+rnd()*.9,0x8a8a84)}
ore(-4.2,-4,0x7d7b76,0xb9c2c8); // metal ore
ore(4.6,-6,0x7a7468,0xe3c93a);  // sulfur ore
ore(1.5,-9.5,0x6b625a,0xd17f3a);// stone with copper flecks
// grass tufts
const tuft=new THREE.ConeGeometry(.06,.6,3);for(let i=0;i<500;i++){const x=(rnd()-.5)*40,z=(rnd()-.5)*36-6;const t=add(tuft,M(rnd()<.5?0x6c9440:0x7fa64a),x,hgt(x,z)+.25,z,false);t.rotation.z=(rnd()-.5)*.5}

// character (stylised placeholder)
const hero=new THREE.Group();s.add(hero);
const part=(g,c,x,y,z)=>{const m=new THREE.Mesh(g,M(c));m.position.set(x,y,z);m.castShadow=true;hero.add(m);return m};
part(new THREE.BoxGeometry(.5,.75,.3),0x40513a,0,1.25,0);part(new THREE.BoxGeometry(.22,.7,.24),0x3a3328,-.13,.45,0);part(new THREE.BoxGeometry(.22,.7,.24),0x3a3328,.13,.45,0);
part(new THREE.BoxGeometry(.32,.34,.32),0xc99a72,0,1.83,0);part(new THREE.BoxGeometry(.36,.16,.36),0x6b2f22,0,2.02,0);
part(new THREE.BoxGeometry(.42,.5,.22),0x6b5134,0,1.3,.27);
const armL=part(new THREE.BoxGeometry(.16,.62,.18),0x40513a,-.34,1.25,0),armR=new THREE.Group();armR.position.set(.34,1.55,0);hero.add(armR);
const a2=new THREE.Mesh(new THREE.BoxGeometry(.16,.62,.18),M(0x40513a));a2.position.y=-.3;a2.castShadow=true;armR.add(a2);
const axe=new THREE.Group();axe.position.set(0,-.62,-.05);armR.add(axe);
const h=new THREE.Mesh(new THREE.CylinderGeometry(.03,.03,.8,5),M(0x7a5532));h.rotation.x=Math.PI/2;h.position.z=-.3;axe.add(h);
const bl=new THREE.Mesh(new THREE.BoxGeometry(.04,.22,.28),new THREE.MeshStandardMaterial({color:0xb7bcc0,metalness:.7,roughness:.3,flatShading:true}));bl.position.set(0,.06,-.66);axe.add(bl);
hero.position.set(-2.4,hgt(-2.4,-1.8),-1.8);hero.rotation.y=-.7;

// campfire
const fy=hgt(2.6,1);for(let i=0;i<5;i++){const l=add(new THREE.CylinderGeometry(.08,.08,.9,5),M(0x5a3d26),2.6,fy+.15,1);l.rotation.z=1.2;l.rotation.y=i*1.26}
const fire=add(new THREE.ConeGeometry(.3,.8,6),new THREE.MeshBasicMaterial({color:0xffa23a}),2.6,fy+.55,1,false);
const fl=new THREE.PointLight(0xff8a2a,1.4,9);fl.position.set(2.6,fy+1,1);s.add(fl);

// minimap
const mc=document.getElementById('mini').getContext('2d');
mc.fillStyle='#2f6f86';mc.fillRect(0,0,200,200);mc.fillStyle='#6f8d42';mc.beginPath();mc.ellipse(100,104,74,68,.3,0,6.3);mc.fill();
mc.fillStyle='#d8c38f';mc.beginPath();mc.ellipse(60,150,22,10,.5,0,6.3);mc.fill();mc.fillStyle='#8a8a84';mc.beginPath();mc.ellipse(128,76,22,16,0,0,6.3);mc.fill();
[['#b9c2c8',90,96],['#e3c93a',112,92],['#ff8a2a',104,110]].forEach(d=>{mc.fillStyle=d[0];mc.beginPath();mc.arc(d[1],d[2],4,0,6.3);mc.fill()});

let t=0;function loop(){t+=.016;const a=t*.08;cam.position.set(Math.sin(a)*9-1,hgt(0,0)+4.2+Math.sin(t*.3)*.3,Math.cos(a)*9+2);cam.lookAt(0,1.4,-3);
 armR.rotation.x=-1.2+Math.max(0,Math.sin(t*3.2))*1.6;armL.rotation.x=Math.sin(t*1.5)*.15;
 fire.scale.set(1+Math.sin(t*12)*.08,1+Math.sin(t*9)*.15,1);fl.intensity=1.25+Math.sin(t*14)*.2;
 r.render(s,cam);requestAnimationFrame(loop)}
loop();
addEventListener('resize',()=>{cam.aspect=W()/H();cam.updateProjectionMatrix();r.setSize(W(),H())});
})();
</script>
